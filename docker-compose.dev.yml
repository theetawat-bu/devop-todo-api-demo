# ใช้คู่กับไฟล์หลัก:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# โหมดนี้ mount source เข้าไปและใช้ tsx watch ให้ hot reload
services:
  api:
    build:
      context: .
      target: builder
    command: sh -c "npx prisma migrate deploy && npx tsx watch src/index.ts"
    environment:
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    deploy:
      replicas: 1
    ports:
      - "3000:3000" # dev เปิดตรงไว้ debug ได้

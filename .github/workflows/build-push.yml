name: Build & Push (reusable)

# workflow นี้ไม่ได้ทำงานเอง — ถูกเรียกโดย workflow อื่นผ่าน `uses:`
# หน้าที่เดียว: build image แล้ว push ขึ้น GHCR แล้วคืน digest ให้ผู้เรียก
# แยกออกมาเพื่อให้ทุกเส้นทาง deploy ใช้ image ที่ build ด้วยวิธีเดียวกันเป๊ะ
on:
  workflow_call:
    inputs:
      tag-prefix:
        description: 'คำนำหน้า tag เช่น dev / main'
        required: true
        type: string
      platforms:
        description: 'สถาปัตยกรรมที่จะ build — Oracle Cloud free tier เป็น ARM ต้องมี arm64 ด้วย'
        required: false
        type: string
        default: linux/amd64,linux/arm64
    outputs:
      digest:
        description: 'sha256 ของ image — ใช้ตอน deploy เพื่อความแม่นยำ'
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: 'ชื่อ image เต็มพร้อม digest'
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build multi-arch → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      # ชื่อ repo อาจมีตัวพิมพ์ใหญ่ แต่ registry บังคับตัวพิมพ์เล็กทั้งหมด
      - name: แปลงชื่อ image เป็นตัวพิมพ์เล็ก
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # QEMU จำเป็นเมื่อ build arm64 บน runner ที่เป็น x86
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: คิด tag ให้อัตโนมัติ
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ inputs.tag-prefix }}
            type=sha,prefix=${{ inputs.tag-prefix }}-,format=short
            type=semver,pattern={{version}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ inputs.tag-prefix }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: สแกนช่องโหว่ของ image ที่เพิ่ง build
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # รายงานอย่างเดียว ยังไม่บล็อก — เปลี่ยนเป็น 1 เมื่อพร้อม

      - name: สรุปผล
        run: |
          {
            echo "### 📦 Image ที่ build"
            echo '```'
            echo "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "- platforms: \`${{ inputs.platforms }}\`"
            echo "- tags: ${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"

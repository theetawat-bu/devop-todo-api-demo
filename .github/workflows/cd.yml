name: CD

# CD = พอ merge เข้า main (หรือ tag version) ให้ build image, push ขึ้น GHCR
# แล้ว (ถ้าตั้ง secret KUBE_CONFIG ไว้) deploy ขึ้น Kubernetes ต่อ
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: # กดรันเองจากหน้าเว็บได้

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # เช่น johndoe/devops-todo-api

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ต้องมีถึงจะ push ขึ้น ghcr ได้ (ใช้ GITHUB_TOKEN ไม่ต้องสร้าง PAT)
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # คิด tag ให้อัตโนมัติ: latest, sha, semver
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed image :rocket:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    # ข้าม job นี้ถ้ายังไม่ได้ตั้ง secret KUBE_CONFIG (ตอนฝึกในเครื่องยังไม่ต้องมี)
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production # ใส่ required reviewer ที่ Settings > Environments เพื่อบังคับ approve ก่อน deploy ได้
    steps:
      - uses: actions/checkout@v4

      - name: Check kubeconfig secret
        id: check
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "::warning::ยังไม่ได้ตั้ง secret KUBE_CONFIG — ข้ามขั้นตอน deploy"
          else
            echo "has_config=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup kubectl
        if: steps.check.outputs.has_config == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Write kubeconfig
        if: steps.check.outputs.has_config == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        if: steps.check.outputs.has_config == 'true'
        run: |
          kubectl apply -k k8s/overlays/production

      - name: Update image & wait for rollout
        if: steps.check.outputs.has_config == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}"
          kubectl -n todo-app set image deployment/todo-api api=$IMAGE
          kubectl -n todo-app rollout status deployment/todo-api --timeout=180s

      - name: Rollback on failure
        if: failure() && steps.check.outputs.has_config == 'true'
        run: kubectl -n todo-app rollout undo deployment/todo-api

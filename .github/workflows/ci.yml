name: CI

# CI = ตรวจว่าโค้ดที่เข้ามา "ยังใช้ได้" ทุกครั้งที่ push หรือเปิด PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, build & smoke test
    runs-on: ubuntu-latest

    # GitHub Actions ปั้น Postgres ให้เป็น service container ได้เลย
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: tododb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d tododb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app_password@localhost:5432/tododb?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Smoke test (start server & hit endpoints)
        run: |
          node dist/index.js &
          SERVER_PID=$!
          # รอ server พร้อม
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done

          curl -fsS http://localhost:3000/readyz

          echo "--- create ---"
          curl -fsS -X POST http://localhost:3000/api/todos \
            -H 'Content-Type: application/json' \
            -d '{"title":"from ci"}' | tee /tmp/created.json

          echo "--- list ---"
          curl -fsS http://localhost:3000/api/todos

          echo "--- validation should return 400 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/todos \
            -H 'Content-Type: application/json' -d '{}')
          test "$code" = "400" || { echo "expected 400, got $code"; exit 1; }

          kill $SERVER_PID

  docker-build:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    needs: build-and-test
    # PR แค่ตรวจว่า image build ผ่าน ไม่ต้อง push
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devops-todo-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

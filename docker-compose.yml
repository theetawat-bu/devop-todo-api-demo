services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-tododb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # เปิดไว้ให้ต่อจากเครื่องตัวเอง (prod ควรปิด)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-tododb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ${IMAGE:-devops-todo-api:local}
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-tododb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000" # ไม่ publish ออกนอก — ให้เข้าผ่าน nginx เท่านั้น
    deploy:
      replicas: 2 # ลองหลาย replica เพื่อดู nginx load balance
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: todo-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    networks: [appnet]

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge

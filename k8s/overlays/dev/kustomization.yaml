apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app

resources:
  - ../../base

# dev ใช้ replica เดียว ประหยัดเครื่อง
patches:
  - target:
      kind: Deployment
      name: todo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: todo-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1

# แก้ชื่อ image ให้ตรงกับของคุณ (หรือใช้ image ที่ build ในเครื่อง)
images:
  - name: ghcr.io/OWNER/REPO
    newName: devops-todo-api
    newTag: local

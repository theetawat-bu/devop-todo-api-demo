apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: todo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: todo-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: todo.example.com

# CD จะ set image ทับด้วย digest อีกที แต่ใส่ไว้ให้ apply เดี่ยว ๆ ก็ทำงานได้
images:
  - name: ghcr.io/OWNER/REPO
    newTag: latest

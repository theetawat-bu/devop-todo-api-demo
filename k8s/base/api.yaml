---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo-app
  labels:
    app: todo-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: todo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # ไม่ให้ downtime ตอน deploy
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      # รอ DB พร้อม + รัน migration ก่อน container หลักจะสตาร์ท
      initContainers:
        - name: migrate
          image: ghcr.io/OWNER/REPO:latest # จะถูก set image ทับโดย CD
          command: ["sh", "-c", "npx prisma migrate deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: todo-secret, key: DATABASE_URL }
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO:latest # <-- แก้เป็น repo ของคุณ
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: todo-secret, key: DATABASE_URL }
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # liveness = ยังไม่ตายใช่ไหม (ถ้าไม่ผ่าน k8s จะ restart)
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # readiness = พร้อมรับ traffic ไหม (ถ้าไม่ผ่าน k8s แค่ถอดออกจาก Service)
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # startup = ให้เวลา boot ก่อนเริ่มนับ liveness
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: todo-app
spec:
  type: ClusterIP
  selector:
    app: todo-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# กันไม่ให้ pod ถูกไล่ออกพร้อมกันทั้งหมดตอน node maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: todo-api-pdb
  namespace: todo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: todo-api

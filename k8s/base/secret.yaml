# ⚠️ ไฟล์นี้เป็น "ตัวอย่างสำหรับฝึก" เท่านั้น
# ของจริงห้าม commit Secret ลง git — ให้ใช้ Sealed Secrets / External Secrets / SOPS
# หรือสร้างด้วยมือ:
#   kubectl -n todo-app create secret generic todo-secret \
#     --from-literal=POSTGRES_PASSWORD='xxx' \
#     --from-literal=DATABASE_URL='postgresql://app:xxx@postgres:5432/tododb?schema=public'
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: "app_password"
  DATABASE_URL: "postgresql://app:app_password@postgres:5432/tododb?schema=public"

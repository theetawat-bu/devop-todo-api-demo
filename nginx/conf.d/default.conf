# upstream ชี้ไปที่ service ชื่อ "api" ใน docker network
# Docker DNS จะคืน IP ของทุก replica ทำให้ nginx กระจาย request ให้เอง
upstream api_backend {
    # เปลี่ยนอัลกอริทึมได้โดยเปิดบรรทัดใดบรรทัดหนึ่ง (ไม่ใส่ = round-robin)
    # least_conn;              # request ใช้เวลาต่างกันมาก
    # ip_hash;                 # ต้องการ sticky session

    # passive health check: พังครบ 3 ครั้งใน 10 วิ → พัก backend ตัวนี้ไว้ 10 วิ
    # (nginx OSS ทำ active health check ไม่ได้ ต้องใช้ NGINX Plus)
    server api:3000 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # health ของตัว nginx เอง (ไม่ต้อง proxy)
    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # health check ของ API — ไม่ควรโดน rate limit ไม่งั้น monitoring จะพัง
    location ~ ^/(healthz|readyz)$ {
        access_log off;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        # burst=20 = ยอมให้พุ่งเกินได้ 20 req แล้วค่อย ๆ ปล่อย
        # nodelay = ปล่อย burst ทันทีแทนที่จะหน่วง
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://api_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ถ้า upstream ตัวหนึ่งล่ม ให้ลองตัวถัดไป
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
        return 404 '{"error":"Not found"}';
        add_header Content-Type application/json;
    }
}

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # log format ที่มี upstream ให้เห็นว่า request วิ่งไป container ไหน / ใช้เวลาเท่าไร
    log_format main '$remote_addr - $status "$request" '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;

    # ---- Rate limiting ----
    # เก็บสถานะต่อ IP ในหน่วยความจำ 10MB, จำกัด 10 req/s
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # จำกัดจำนวน connection พร้อมกันต่อ IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
